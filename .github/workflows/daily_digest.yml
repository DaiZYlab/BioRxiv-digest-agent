name: Daily BioRxiv Digest

on:
  schedule:
    # 13:00 UTC = 7:00 AM CST (St. Louis Time)
    - cron: '0 13 * * *'
   
  # Allows manual testing from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run_digest_agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # We explicitly install requests for the BioRxiv script
          pip install requests
          # If you have other requirements, this installs them too
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Digest Agent and Send Email
        env:
          # --- Environment Variables (Secrets) ---
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          # Note: ENTREZ_EMAIL is removed as BioRxiv does not use it.
          # ---------------------------------------
        run: python daily_digest_agent.py
